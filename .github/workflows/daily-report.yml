name: Gerar Edição Diária

on:
  schedule:
    # todo dia às 7h UTC (8h Irlanda)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install certifi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Gerar edição (pula sozinho se não houver novidade suficiente)
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/generate_report.py

      - name: Commitar e publicar (só se uma edição nova foi criada)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ ! -f "posts/${TODAY}.md" ]; then
            echo "Nenhuma edição nova hoje, nada a publicar."
            exit 0
          fi

          git config user.email "bot@irlandaparabrasileiros.com"
          git config user.name "Bot Irlanda"
          git add "posts/${TODAY}.md" data/seen-articles.json

          if git diff --cached --quiet; then
            echo "Edição de hoje já estava commitada (rodada duplicada), nada a fazer."
            exit 0
          fi

          git commit -m "edicao: ${TODAY}"
          git push origin main

          curl -sf -X POST "$DEPLOY_HOOK_URL"
