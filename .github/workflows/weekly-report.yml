name: Gerar Relatório Semanal

on:
  schedule:
    # toda segunda-feira às 8h UTC (5h de Brasília, 9h da Irlanda)
    - cron: "0 8 * * 1"
  workflow_dispatch: # permite rodar manualmente pelo GitHub

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install anthropic certifi

      - name: Gerar relatório
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py

      - name: Abrir PR com o novo relatório para revisão humana
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "relatorio: $(date +%Y-%m-%d)"
          branch: relatorio-automatico
          delete-branch: true
          title: "Novo relatório semanal — revisar antes de publicar"
          body: |
            Relatório gerado automaticamente pelo `generate_report.py`.

            **Antes de aprovar:** confira toda afirmação sobre lei, visto ou prazo contra a fonte oficial primária (Citizens Information, Departamento de Justiça, ECB, CSO). Nada vai ao ar sem essa checagem.
          labels: revisao-necessaria
